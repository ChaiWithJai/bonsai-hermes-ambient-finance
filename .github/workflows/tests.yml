name: Reproduce local calculation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python make_mock_sources.py
      - run: python -m unittest -v test_finance.py
      - run: python run_schedule.py --cadence nightly --as-of 2026-09-25
